run_budget_usd: 15.0

# Portabilidade: a empresa roda em qualquer runtime com adapter no motor.
# O motor NUNCA fixa modelo em runtime que não seja o Claude Code (o runtime decide);
# o campo `model` dos funcionários é intenção de tier, traduzida por `model_policy`.
runtime_requirements:
  policy: active
  compatible:
    - claude-code
    - codex
    - antigravity-cli
    - pi
    - hermes
features_required:
  - shell_exec
  - file_write
  - subagent_spawning
features_optional:
  - mcp:davinci-resolve
  - mcp:premiere-pro
  - mcp:fcpxml
  - mcp:capcut-smartcut
  - mcp:google-drive
  - mcp:vidiq

# Tier de modelo por cargo (intenção) → o que cada runtime executa.
# "forte" = julgamento e orquestração (diretor, conselho); "padrão" = execução com desenho decidido.
# No Claude Code o maestro passa o alias; nos demais o runtime usa o modelo configurado
# pelo usuário (NIRVANA_MODEL ou a config do próprio runtime), e o tier vira só `effort`.
model_policy:
  tiers:
    forte: [lead-editorial-director, council-editorial-arbiter]
    padrao: [smart-clip-editor, color-grading-colorist, cinematography-ai-director, asset-broll-curator, reference-scout, motion-hyperframes-engineer, retention-subtitles-specialist]
  by_runtime:
    claude-code: { forte: opus, padrao: sonnet, override_env: NIRVANA_MODEL }   # fable só por decisão do dono (NIRVANA_MODEL=fable)
    codex: { forte: astra, padrao: inherit, note: "Astra = modelo OpenAI (decisão do dono, 02/10/2026); o motor só passa --model via NIRVANA_MODEL, senão vale o model do ~/.codex/config.toml; effort high no forte" }
    antigravity-cli: { forte: inherit, padrao: inherit }
    pi: { forte: inherit, padrao: inherit, note: "um runtime, 15+ providers e modelos locais; escolha pelo --provider" }
    hermes: { forte: inherit, padrao: inherit }
  rule: "Tier é intenção, não contrato. Um runtime sem alias usa o seu padrão; o que não muda entre runtimes é o effort (forte=high) e a aceitação por cargo."

# Voz única: a pessoa fala sempre com o Merlin (persona do lead-editorial-director).
ui:
  client_facing_name: Merlin
  category: video

# Memória viva: o que os runs propõem e o dono promove entra pelo `nrv memory add magic-frames`
# (injetado em todo prompt de funcionário como memória temporal ativa). Protocolo: playbooks/debriefing.md
memory:
  permanent:
    enabled: true
    files: [memory/permanent.md]
    garbage_collection:
      max_facts: 500
      review_interval_days: 30
      conflict_resolution: append   # nunca apaga: fato que muda é substituído (nrv memory supersede)
learning:
  loop: playbooks/debriefing.md
  promotion_command: "nrv memory add magic-frames \"<fato>\" --source <trace>"
  long_cycle: "nrv improver run --days=30 (mensal ou a cada dez entregas)"
