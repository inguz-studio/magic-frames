name: magic-frames
slug: magic-frames
author: "Vitor Piagge"
version: 2.0.0
license: proprietary
protocol: "2.0"
description: >
  Estúdio de edição de vídeo cinematográfica, retenção de YouTube e short-form dinâmico de alta conversão. Combina a gramática clássica de montagem de cinema (Walter Murch, Thelma Schoonmaker, Sally Menke, Kirk Baxter) com as técnicas modernas de retenção visual (Hayden Hillier-Smith, Paddy Galloway, Sam Kolder, Alex Hormozi). Opera em quatro pilares integrados: (1) Direção técnica de ângulos de câmera, lentes e movimentos para geração de cenas por IA (Veo 3.1, Sora, Kling, Runway); (2) Mineração de assets reais e B-roll contextual via MCP de bancos de imagens (Pexels, Pixabay) e download de mídia para inserts ágeis; (3) Motion design code-based via HyperFrames (framework agent-native da HeyGen) e Remotion para overlays determinísticos, kinetic typography e gráficos interativos; (4) Sistema de legendagem de alta retenção respeitando safe zones verticais, com gating adversarial pelo conselho executivo de edição; (5) Colorização: correção primária, gerenciamento de cor (log → Rec.709), look criativo por LUT/CDL e emulação de filme, aplicados por FFmpeg e HyperFrames com conferência por scopes; (6) Smart Clipper: corte de vídeo longo local (podcast, aula, live, entrevista) em clipes verticais 9:16 de 40 a 150 segundos, com transcrição por palavra, seleção de momentos e render acelerado por VideoToolbox via FFmpeg.
