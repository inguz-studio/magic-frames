<!doctype html>
<html lang="pt-BR" data-composition-variables='[{"id":"text","type":"string","label":"Texto","default":"MARINA COSTA"},{"id":"font","type":"string","label":"Fonte","default":"montserrat"},{"id":"weight","type":"number","label":"Peso","default":800},{"id":"size","type":"number","label":"Tamanho","default":58},{"id":"color","type":"color","label":"Cor","default":"#FFFFFF"},{"id":"accent","type":"color","label":"Acento","default":"#FFE600"},{"id":"stroke","type":"number","label":"Contorno","default":6},{"id":"start","type":"number","label":"Início","default":0},{"id":"duration","type":"number","label":"Duração","default":4},{"id":"y","type":"number","label":"Centro vertical","default":1050},{"id":"role","type":"string","label":"Cargo","default":"DIRETORA DE PRODUTO"}]'>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lower third de nome</title>
<style>
  :root { --font: Montserrat; --weight: 900; --size: 84px; --color: #fff; --accent: #FFE600; --stroke: 6px; --y: 1105px; }

</head>
<body>
<div id="stage" data-composition-id="lower-third" data-width="1080" data-height="1920" data-duration="4"><div id="lower"><div id="bar"></div><div id="lower-copy"><div id="lower-name"></div><div id="lower-role"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>(()=>{const FONT_MAP = { montserrat: "Montserrat", anton: "Anton", bebasneue: "Bebas Neue", oswald: "Oswald", archivoblack: "Archivo Black" };
  const vars = window.__hyperframes.getVariables();
  const stage = document.getElementById("stage");
  stage.dataset.duration = String(vars.duration);
  stage.style.setProperty("--font", FONT_MAP[vars.font] || "Montserrat");
  stage.style.setProperty("--weight", String(vars.weight));
  stage.style.setProperty("--size", vars.size + "px");
  stage.style.setProperty("--color", vars.color);

  stage.style.setProperty("--stroke", vars.stroke + "px");
  stage.style.setProperty("--y", vars.y + "px");
  const tl = gsap.timeline({ paused: true });
 const lowerRoot=document.getElementById("lower"); const name=document.getElementById("lower-name"); const role=document.getElementById("lower-role"); const lower=document.getElementById("lower-copy"); const bar=document.getElementById("bar"); lowerRoot.style.top=`${vars.y-85}px`; name.style.fontFamily=`"${FONT_MAP[vars.font] || "Montserrat"}", sans-serif`; name.style.fontWeight=String(vars.weight); name.style.fontSize=`${vars.size}px`; name.style.color=vars.color; role.style.color=vars.accent; bar.style.background=vars.accent; name.textContent=String(vars.text).toLocaleUpperCase("pt-BR"); role.textContent=String(vars.role).toLocaleUpperCase("pt-BR"); tl.fromTo(bar,{opacity:0,scaleY:0},{opacity:1,scaleY:1,duration:.38,ease:"cubic-bezier(0.16, 1, 0.3, 1)"},vars.start); tl.fromTo(lower,{opacity:0,x:-48,scale:.98},{opacity:1,x:0,scale:1,duration:.52,ease:"back.out(1.25)"},vars.start+.08); tl.fromTo([lower,bar],{opacity:1,x:0},{opacity:0,x:-28,duration:.3,ease:"power2.in"},vars.duration-.3);
  window.__timelines = window.__timelines || {};

</body>
