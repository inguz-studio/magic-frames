<!doctype html>
<html lang="pt-BR" data-composition-variables='[{"id":"text","type":"string","label":"Texto","default":"A PROVA ESTÁ NOS DADOS"},{"id":"font","type":"string","label":"Fonte","default":"oswald"},{"id":"weight","type":"number","label":"Peso","default":700},{"id":"size","type":"number","label":"Tamanho","default":76},{"id":"color","type":"color","label":"Cor","default":"#FFFFFF"},{"id":"accent","type":"color","label":"Acento","default":"#FFE600"},{"id":"stroke","type":"number","label":"Contorno","default":6},{"id":"start","type":"number","label":"Início","default":0},{"id":"duration","type":"number","label":"Duração","default":3.5},{"id":"y","type":"number","label":"Centro vertical","default":430}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css">
<title>Máquina de escrever</title>
<style>
  :root { --font: Montserrat; --weight: 900; --size: 84px; --color: #fff; --accent: #FFE600; --stroke: 6px; --y: 1105px; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--font), sans-serif; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  * { box-sizing: border-box; }
.type-line { position:absolute; left:80px; top:calc(var(--y) - 70px); width:860px; min-height:140px; display:flex; align-items:center; justify-content:center; color:var(--color); font-size:var(--size); font-weight:var(--weight); line-height:1.05; text-align:center; -webkit-text-stroke:var(--stroke) #000; paint-order:stroke fill; text-shadow:0 6px 18px rgba(0,0,0,.3); } #cursor { width:8px; height:1.05em; margin-left:12px; background:var(--accent); opacity:0; }</style>
</head>
<body>
<div id="stage" data-composition-id="typewriter" data-width="1080" data-height="1920" data-duration="3.5"><div class="type-line"><span id="typed"></span><span id="cursor" aria-hidden="true"></span></div></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>(()=>{const FONT_MAP = { montserrat: "Montserrat", anton: "Anton", bebasneue: "Bebas Neue", oswald: "Oswald", archivoblack: "Archivo Black" };
  const vars = window.__hyperframes.getVariables();
  const stage = document.getElementById("stage");
  stage.dataset.duration = String(vars.duration);
  stage.style.setProperty("--font", FONT_MAP[vars.font] || "Montserrat");
  stage.style.setProperty("--weight", String(vars.weight));
  stage.style.setProperty("--size", vars.size + "px");
  stage.style.setProperty("--color", vars.color);
  stage.style.setProperty("--accent", vars.accent);
  stage.style.setProperty("--stroke", vars.stroke + "px");
  stage.style.setProperty("--y", vars.y + "px");
  const tl = gsap.timeline({ paused: true });
 const line=document.querySelector(".type-line"); const typed=document.getElementById("typed"); const cursor=document.getElementById("cursor"); line.style.top=`${vars.y-70}px`; line.style.fontFamily=`"${FONT_MAP[vars.font] || "Oswald"}", sans-serif`; line.style.fontWeight=String(vars.weight); line.style.fontSize=`${vars.size}px`; line.style.color=vars.color; line.style.webkitTextStroke=`${vars.stroke}px #000`; line.style.paintOrder="stroke fill"; cursor.style.background=vars.accent; const full=String(vars.text).toLocaleUpperCase("pt-BR"); const state={n:0}; tl.fromTo(state,{n:0},{n:full.length,duration:Math.max(.4,vars.duration-vars.start-1),ease:"none",snap:{n:1},onUpdate:()=>{typed.textContent=full.slice(0,state.n)}},vars.start); const blinkStart=vars.start+.2; for(let i=0;i<6;i++){tl.fromTo(cursor,{opacity:i%2?1:0},{opacity:i%2?0:1,duration:.18,ease:"none"},blinkStart+i*.18);} tl.fromTo(cursor,{opacity:1},{opacity:0,duration:.15,ease:"power2.in"},vars.duration-.15);
  window.__timelines = window.__timelines || {};
  window.__timelines["typewriter"] = tl;
})();</script>
</body>
</html>
