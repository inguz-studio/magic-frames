id: ab-labels
nome: "Rótulos A e B"
uso: título
descricao: "Comparação em dois lados com destaque parametrizado no vencedor."
canvas: { largura: 1080, altura: 1920, fundo: transparente }
variaveis:
  - nome: text
    tipo: string
    padrao: "COMPARAÇÃO"
  - nome: font
    tipo: string
    padrao: "montserrat"
  - nome: weight
    tipo: number
    padrao: 900
    limites: "100–900 conforme a fonte"
  - nome: size
    tipo: number
    padrao: 54
    limites: "48–180 px conforme o uso"
  - nome: color
    tipo: color
    padrao: "#FFFFFF"
  - nome: accent
    tipo: color
    padrao: "#FFE600"
  - nome: stroke
    tipo: number
    padrao: 6
    limites: "0–6 px"
  - nome: start
    tipo: number
    padrao: 0
    limites: ">= 0 s"
  - nome: duration
    tipo: number
    padrao: 3.5
    limites: "> 0 s"
  - nome: y
    tipo: number
    padrao: 510
    limites: "dentro da zona segura declarada"
  - nome: labelA
    tipo: string
    padrao: "OPÇÃO A"
  - nome: labelB
    tipo: string
    padrao: "OPÇÃO B"
  - nome: winner
    tipo: string
    padrao: "B"
formatos_que_combinam: [08-a-vs-b-comparison, 07-scenarios]
zona_segura: "X 80–940; Y 300–720; centro Y=510"
render:
  fps: 30
  alpha: true
  formatos: [webm-vp9, prores-4444]
