<!doctype html>
<html lang="pt-BR" data-composition-variables='[{"id":"text","type":"string","label":"Texto","default":"COMPARAÇÃO"},{"id":"font","type":"string","label":"Fonte","default":"montserrat"},{"id":"weight","type":"number","label":"Peso","default":900},{"id":"size","type":"number","label":"Tamanho","default":54},{"id":"color","type":"color","label":"Cor","default":"#FFFFFF"},{"id":"accent","type":"color","label":"Acento","default":"#FFE600"},{"id":"stroke","type":"number","label":"Contorno","default":6},{"id":"start","type":"number","label":"Início","default":0},{"id":"duration","type":"number","label":"Duração","default":3.5},{"id":"y","type":"number","label":"Centro vertical","default":510},{"id":"labelA","type":"string","label":"Rótulo A","default":"OPÇÃO A"},{"id":"labelB","type":"string","label":"Rótulo B","default":"OPÇÃO B"},{"id":"winner","type":"string","label":"Vencedor (A ou B)","default":"B"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css">
<title>Rótulos A e B</title>
<style>
  :root { --font: Montserrat; --weight: 900; --size: 84px; --color: #fff; --accent: #FFE600; --stroke: 6px; --y: 1105px; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--font), sans-serif; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  * { box-sizing: border-box; }
#compare { position:absolute; left:100px; top:calc(var(--y) - 190px); width:820px; height:380px; display:grid; grid-template-columns:1fr 4px 1fr; gap:28px; align-items:center; background:transparent; } .label { height:260px; padding:34px 28px; border:2px solid rgba(255,255,255,.22); border-radius:28px; background:rgba(8,12,20,.68); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--color); opacity:0; } .label.winner { border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent); } .tag { display:grid; place-items:center; width:74px; height:74px; border-radius:50%; margin-bottom:26px; background:var(--color); color:#090D14; font:900 42px Montserrat,sans-serif; } .winner .tag { background:var(--accent); } .copy { font-size:var(--size); font-weight:var(--weight); line-height:1; } #divider { width:4px; height:240px; border-radius:2px; background:rgba(255,255,255,.3); opacity:0; transform-origin:center; }</style>
</head>
<body>
<div id="stage" data-composition-id="ab-labels" data-width="1080" data-height="1920" data-duration="3.5"><div id="compare"><div id="label-a" class="label"><span class="tag">A</span><span class="copy"></span></div><div id="divider"></div><div id="label-b" class="label"><span class="tag">B</span><span class="copy"></span></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>(()=>{const FONT_MAP = { montserrat: "Montserrat", anton: "Anton", bebasneue: "Bebas Neue", oswald: "Oswald", archivoblack: "Archivo Black" };
  const vars = window.__hyperframes.getVariables();
  const stage = document.getElementById("stage");
  stage.dataset.duration = String(vars.duration);
  stage.style.setProperty("--font", FONT_MAP[vars.font] || "Montserrat");
  stage.style.setProperty("--weight", String(vars.weight));
  stage.style.setProperty("--size", vars.size + "px");
  stage.style.setProperty("--color", vars.color);
  stage.style.setProperty("--accent", vars.accent);
  stage.style.setProperty("--stroke", vars.stroke + "px");
  stage.style.setProperty("--y", vars.y + "px");
  const tl = gsap.timeline({ paused: true });
 const compare=document.getElementById("compare"); const a=document.getElementById("label-a"); const b=document.getElementById("label-b"); const divider=document.getElementById("divider"); compare.style.top=`${vars.y-190}px`; [a,b].forEach((el)=>{el.style.fontFamily=`"${FONT_MAP[vars.font] || "Montserrat"}", sans-serif`; el.style.fontWeight=String(vars.weight); el.style.color=vars.color; el.querySelector(".copy").style.fontSize=`${vars.size}px`;}); a.querySelector(".copy").textContent=vars.labelA; b.querySelector(".copy").textContent=vars.labelB; const winner=String(vars.winner).toUpperCase()==="A"?a:b; winner.classList.add("winner"); winner.style.borderColor=vars.accent; winner.querySelector(".tag").style.background=vars.accent; tl.fromTo(a,{opacity:0,x:-10,scale:.94},{opacity:1,x:0,scale:1,duration:.52,ease:"back.out(1.3)"},vars.start); tl.fromTo(b,{opacity:0,x:10,scale:.94},{opacity:1,x:0,scale:1,duration:.52,ease:"back.out(1.3)"},vars.start+.08); tl.fromTo(divider,{opacity:0,scaleY:0},{opacity:1,scaleY:1,duration:.4,ease:"cubic-bezier(0.16, 1, 0.3, 1)"},vars.start+.18); tl.fromTo(winner,{opacity:1,scale:1},{opacity:1,scale:1.02,duration:.18,ease:"back.out(1.7)"},vars.start+.62); tl.fromTo(winner,{opacity:1,scale:1.02},{opacity:1,scale:1,duration:.18,ease:"cubic-bezier(0.16, 1, 0.3, 1)"},vars.start+.8); tl.fromTo([a,b,divider],{opacity:1,y:0},{opacity:0,y:-20,duration:.26,ease:"power2.in"},vars.duration-.26);
  window.__timelines = window.__timelines || {};
  window.__timelines["ab-labels"] = tl;
})();</script>
</body>
</html>
