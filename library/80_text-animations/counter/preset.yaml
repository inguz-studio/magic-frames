id: counter
nome: "Contador numérico"
uso: dado
descricao: "Número cresce de zero ao valor, com prefixo e sufixo parametrizados."
canvas: { largura: 1080, altura: 1920, fundo: transparente }
variaveis:
  - nome: text
    tipo: string
    padrao: "RESULTADO"
  - nome: font
    tipo: string
    padrao: "bebasneue"
  - nome: weight
    tipo: number
    padrao: 400
    limites: "100–900 conforme a fonte"
  - nome: size
    tipo: number
    padrao: 150
    limites: "72–180 px conforme o uso"
  - nome: color
    tipo: color
    padrao: "#FFFFFF"
  - nome: accent
    tipo: color
    padrao: "#FFE600"
  - nome: stroke
    tipo: number
    padrao: 6
    limites: "0–6 px"
