<!doctype html>
<html lang="pt-BR" data-composition-variables='[{"id":"text","type":"string","label":"Texto","default":"RESULTADO"},{"id":"font","type":"string","label":"Fonte","default":"bebasneue"},{"id":"weight","type":"number","label":"Peso","default":400},{"id":"size","type":"number","label":"Tamanho","default":150},{"id":"color","type":"color","label":"Cor","default":"#FFFFFF"},{"id":"accent","type":"color","label":"Acento","default":"#FFE600"},{"id":"stroke","type":"number","label":"Contorno","default":6},{"id":"start","type":"number","label":"Início","default":0},{"id":"duration","type":"number","label":"Duração","default":3.2},{"id":"y","type":"number","label":"Centro vertical","default":430},{"id":"value","type":"number","label":"Valor final","default":250},{"id":"prefix","type":"string","label":"Prefixo","default":"+"},{"id":"suffix","type":"string","label":"Sufixo","default":"%"},{"id":"decimals","type":"number","label":"Casas decimais","default":0}]'>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css">
<title>Contador numérico</title>
<style>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

 const wrap=document.querySelector(".counter-wrap"); const valueEl=document.getElementById("counter-value"); const label=document.getElementById("counter-label"); wrap.style.top=`${vars.y-130}px`; valueEl.style.fontFamily=`"${FONT_MAP[vars.font] || "Bebas Neue"}", sans-serif`; valueEl.style.fontWeight=String(vars.weight); valueEl.style.fontSize=`${vars.size}px`; valueEl.style.color=vars.color; valueEl.style.webkitTextStroke=`${vars.stroke}px #000`; valueEl.style.paintOrder="stroke fill"; label.style.color=vars.accent; label.textContent=vars.text; const state={v:0}; const format=()=>{valueEl.textContent=vars.prefix+Number(state.v).toLocaleString("pt-BR",{minimumFractionDigits:vars.decimals,maximumFractionDigits:vars.decimals})+vars.suffix}; format(); tl.fromTo(valueEl,{opacity:0,scale:.72},{opacity:1,scale:1,duration:.4,ease:"back.out(1.5)"},vars.start); tl.fromTo(state,{v:0},{v:vars.value,duration:Math.max(.5,vars.duration-vars.start-1),ease:"power3.out",onUpdate:format},vars.start); tl.fromTo(label,{opacity:0,y:24},{opacity:1,y:0,duration:.42,ease:"cubic-bezier(0.16, 1, 0.3, 1)"},vars.start+.35); tl.fromTo([valueEl,label],{opacity:1,y:0},{opacity:0,y:-18,duration:.25,ease:"power2.in"},vars.duration-.25);

</body>
