<!doctype html>
<html lang="pt-BR" data-composition-variables='[{"id":"text","type":"string","label":"Texto","default":"O MÉTODO EM 3 PASSOS"},{"id":"font","type":"string","label":"Fonte","default":"anton"},{"id":"weight","type":"number","label":"Peso","default":400},{"id":"size","type":"number","label":"Tamanho","default":84},{"id":"color","type":"color","label":"Cor","default":"#FFFFFF"},{"id":"accent","type":"color","label":"Acento","default":"#FFE600"},{"id":"stroke","type":"number","label":"Contorno","default":6},{"id":"start","type":"number","label":"Início","default":0},{"id":"duration","type":"number","label":"Duração","default":3},{"id":"y","type":"number","label":"Centro vertical","default":430}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css">
<title>Revelação por máscara</title>
<style>
  @font-face { font-family: "anton"; src: url("fonts/anton/Anton-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: block; }
  :root { --font: Montserrat; --weight: 900; --size: 84px; --color: #fff; --accent: #FFE600; --stroke: 6px; --y: 1105px; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--font), sans-serif; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  * { box-sizing: border-box; }
.mask { position:absolute; left:80px; top:calc(var(--y) - 80px); width:860px; height:160px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:transparent; } #masked-text { color:var(--color); font-size:var(--size); font-weight:var(--weight); line-height:1; text-align:center; -webkit-text-stroke:var(--stroke) #000; paint-order:stroke fill; text-shadow:0 6px 18px rgba(0,0,0,.3); opacity:0; } #accent-rule { position:absolute; left:260px; top:calc(var(--y) + 75px); width:560px; height:10px; border-radius:5px; background:var(--accent); opacity:0; transform-origin:left center; }</style>
</head>
<body>
<div id="stage" data-composition-id="mask-reveal" data-width="1080" data-height="1920" data-duration="3"><div class="mask"><div id="masked-text"></div></div><div id="accent-rule"></div></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>(()=>{const FONT_MAP = { montserrat: "Montserrat", anton: "anton", bebasneue: "Bebas Neue", oswald: "Oswald", archivoblack: "Archivo Black" };
  const vars = window.__hyperframes.getVariables();
  const stage = document.getElementById("stage");
  stage.dataset.duration = String(vars.duration);
  stage.style.setProperty("--font", FONT_MAP[vars.font] || "Montserrat");
  stage.style.setProperty("--weight", String(vars.weight));
  stage.style.setProperty("--size", vars.size + "px");
  stage.style.setProperty("--color", vars.color);
  stage.style.setProperty("--accent", vars.accent);
  stage.style.setProperty("--stroke", vars.stroke + "px");
  stage.style.setProperty("--y", vars.y + "px");
  const tl = gsap.timeline({ paused: true });
 const mask=document.querySelector(".mask"); const text=document.getElementById("masked-text"); const rule=document.getElementById("accent-rule"); mask.style.top=`${vars.y-80}px`; rule.style.top=`${vars.y+75}px`; rule.style.background=vars.accent; text.style.fontFamily=`"${FONT_MAP[vars.font] || "Anton"}", sans-serif`; text.style.fontWeight=String(vars.weight); text.style.fontSize=`${vars.size}px`; text.style.color=vars.color; text.style.webkitTextStroke=`${vars.stroke}px #000`; text.style.paintOrder="stroke fill"; text.textContent=String(vars.text).toLocaleUpperCase("pt-BR"); tl.fromTo(text,{opacity:0,y:100,scale:.98},{opacity:1,y:0,scale:1,duration:.62,ease:"back.out(1.35)"},vars.start); tl.fromTo(rule,{opacity:0,scaleX:0},{opacity:1,scaleX:1,duration:.48,ease:"cubic-bezier(0.16, 1, 0.3, 1)"},vars.start+.22); tl.fromTo([text,rule],{opacity:1,y:0},{opacity:0,y:-24,duration:.28,ease:"power2.in"},vars.duration-.28);
  window.__timelines = window.__timelines || {};
  window.__timelines["mask-reveal"] = tl;
})();</script>
</body>
</html>
