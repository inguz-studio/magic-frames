_sobre: 'formats-manifest — Magic Frames Library. Catálogo de formatos criativos de vídeo curto, trazido do board "Short-Form Lego Bricks" (cópia do Vitor) em 2026-10-02: um cartão por formato (quando usar,
  quando não usar, como executar, ângulos) e os vídeos de exemplo com transcrição e frames. O diretor escolhe o formato por id na entrada do pedido; o Smart Clipper, legendas e motion seguem a receita do
  cartão.'
